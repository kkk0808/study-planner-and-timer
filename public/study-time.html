<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Study Time" />
<meta name="theme-color" content="#f7f2ec" />
<title>Study Time</title>
<style>
  :root {
    --bg: #f7f2ec;
    --card: #fffdfa;
    --ink: #5b5048;
    --ink-soft: #9a8f85;
    --line: #ece3d8;
    --pink: #e7a6ab;
    --pink-soft: #f7dade;
    --sage: #a9bfa4;
    --sage-soft: #e0ebdd;
    --lav: #b3aede;
    --lav-soft: #e6e4f5;
    --gold: #e6c67a;
    --shadow: 0 8px 24px rgba(120, 100, 90, 0.10);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Maru Gothic ProN", "Hiragino Sans", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
  .app { max-width: 560px; margin: 0 auto; padding: 20px 18px 120px; }
  header.top { text-align: center; padding: 12px 0 18px; }
  header.top h1 {
    margin: 0; font-size: 24px; letter-spacing: 0.5px;
    display: inline-flex; align-items: center; gap: 8px;
  }
  header.top .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--pink); display: inline-block; }
  header.top p { margin: 4px 0 0; font-size: 12px; color: var(--ink-soft); }

  .view { display: none; animation: fade 0.35s ease; }
  .view.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 22px; padding: 18px; box-shadow: var(--shadow);
    margin-bottom: 16px;
  }
  .card h2 { margin: 0 0 14px; font-size: 16px; }
  .muted { color: var(--ink-soft); font-size: 13px; }

  /* ---- Calendar ---- */
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .cal-head .title { font-size: 17px; font-weight: 600; }
  .nav-btn {
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    width: 38px; height: 38px; border-radius: 12px; font-size: 18px; cursor: pointer;
  }
  .nav-btn:active { background: var(--pink-soft); }
  .grid7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .dow { text-align: center; font-size: 11px; color: var(--ink-soft); padding: 4px 0; }
  .dow.sun { color: var(--pink); }
  .dow.sat { color: var(--lav); }
  .day {
    aspect-ratio: 1 / 1; border: 1px solid transparent; border-radius: 14px;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding-top: 6px; font-size: 13px; cursor: pointer; position: relative; background: #fbf7f2;
  }
  .day.empty { background: transparent; cursor: default; }
  .day.today { border-color: var(--pink); background: var(--pink-soft); font-weight: 700; }
  .day.selected { outline: 2px solid var(--lav); }
  .day .pips { display: flex; gap: 3px; margin-top: 4px; flex-wrap: wrap; justify-content: center; max-width: 90%; }
  .pip { width: 6px; height: 6px; border-radius: 50%; }

  .events { margin-top: 16px; }
  .event-row {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 14px; margin-bottom: 8px; background: #fbf7f2;
  }
  .event-row .swatch { width: 12px; height: 12px; border-radius: 50%; flex: 0 0 auto; }
  .event-row .etext { flex: 1; font-size: 14px; }
  .event-row .del { border: none; background: none; color: var(--ink-soft); font-size: 18px; cursor: pointer; }

  .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  input[type="text"], select {
    flex: 1; min-width: 0; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line);
    background: #fbf7f2; color: var(--ink); font-size: 15px; font-family: inherit;
  }
  input:focus, select:focus { outline: 2px solid var(--pink); border-color: transparent; }
  .btn {
    border: none; border-radius: 14px; padding: 12px 18px; font-size: 15px; font-weight: 600;
    cursor: pointer; font-family: inherit; background: var(--pink); color: #fff;
  }
  .btn:active { transform: scale(0.97); }
  .btn.ghost { background: var(--pink-soft); color: var(--ink); }
  .btn.sage { background: var(--sage); }
  .btn.block { width: 100%; }

  /* ---- Subjects chips ---- */
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px;
    border: 1px solid var(--line); font-size: 13px; cursor: pointer; background: #fbf7f2;
  }
  .chip .sw { width: 10px; height: 10px; border-radius: 50%; }
  .chip.sel { border-color: var(--ink); background: #fff; }
  .chip .x { color: var(--ink-soft); margin-left: 2px; }

  /* ---- Timer ---- */
  .timer-wrap { text-align: center; }
  .clockart {
    position: relative; width: 200px; height: 200px; margin: 6px auto 8px;
    display: flex; align-items: center; justify-content: center;
  }
  .halo {
    position: absolute; inset: -14px; border-radius: 50%;
    background: radial-gradient(circle, rgba(231,166,171,0.35), rgba(231,166,171,0) 70%);
    opacity: 0; transition: opacity 0.5s;
  }
  .running .halo { opacity: 1; animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  .ring {
    position: absolute; inset: 0; border-radius: 50%;
    border: 3px dashed var(--pink); opacity: 0.55;
  }
  .running .ring { animation: spin 16s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .clockface {
    width: 150px; height: 150px; border-radius: 50%; background: #fff;
    border: 6px solid var(--pink-soft); display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 4px 10px rgba(0,0,0,0.04);
  }
  .clockface svg { width: 88px; height: 88px; }
  .spark {
    position: absolute; font-size: 16px; opacity: 0; pointer-events: none;
    color: var(--gold);
  }
  .running .spark { animation: twinkle 2s ease-in-out infinite; }
  .spark.s1 { top: 6px; left: 30px; animation-delay: 0s; }
  .spark.s2 { top: 20px; right: 18px; animation-delay: .5s; }
  .spark.s3 { bottom: 24px; left: 14px; animation-delay: 1s; }
  .spark.s4 { bottom: 8px; right: 34px; animation-delay: 1.5s; }
  @keyframes twinkle { 0%,100% { opacity: 0; transform: scale(0.6); } 50% { opacity: 1; transform: scale(1.1); } }

  .time-display { font-size: 52px; font-weight: 700; letter-spacing: 1px; font-variant-numeric: tabular-nums; margin: 6px 0 2px; }
  .subj-label { font-size: 14px; color: var(--ink-soft); margin-bottom: 16px; }
  .timer-btns { display: flex; gap: 10px; justify-content: center; }

  /* ---- Report ---- */
  .big-num { font-size: 40px; font-weight: 700; }
  .stat-row { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
  .stat-row .bar-track { flex: 1; height: 12px; background: #f0e8df; border-radius: 999px; overflow: hidden; }
  .stat-row .bar-fill { height: 100%; border-radius: 999px; }
  .stat-row .lab { font-size: 13px; width: 92px; }
  .stat-row .val { font-size: 12px; color: var(--ink-soft); width: 56px; text-align: right; }
  .week { display: flex; align-items: flex-end; gap: 8px; height: 130px; margin-top: 8px; }
  .week .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 6px; }
  .week .colbar { width: 70%; background: var(--sage); border-radius: 8px 8px 4px 4px; min-height: 3px; transition: height .4s; }
  .week .col.today .colbar { background: var(--pink); }
  .week .collabel { font-size: 11px; color: var(--ink-soft); }

  /* ---- Bottom nav ---- */
  nav.tabbar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(255,253,250,0.92); backdrop-filter: blur(10px);
    border-top: 1px solid var(--line);
    display: flex; justify-content: space-around;
    padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
    z-index: 20;
  }
  nav.tabbar button {
    border: none; background: none; color: var(--ink-soft); font-family: inherit;
    display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; cursor: pointer; padding: 4px 16px;
  }
  nav.tabbar button.active { color: var(--pink); font-weight: 700; }
  nav.tabbar button .ic { font-size: 20px; line-height: 1; }
  .empty-note { text-align: center; color: var(--ink-soft); font-size: 13px; padding: 18px 0; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1><span class="dot"></span>Study Time</h1>
    <p>じぶんのペースで、こつこつと</p>
  </header>

  <!-- ===== Calendar ===== -->
  <section class="view active" id="view-cal">
    <div class="card">
      <div class="cal-head">
        <button class="nav-btn" id="prevMonth">‹</button>
        <div class="title" id="monthTitle"></div>
        <button class="nav-btn" id="nextMonth">›</button>
      </div>
      <div class="grid7" id="dowRow"></div>
      <div class="grid7" id="calGrid" style="margin-top:6px;"></div>
    </div>

    <div class="card">
      <h2 id="selDateTitle">予定</h2>
      <div class="events" id="eventList"></div>
      <div class="row">
        <input type="text" id="eventInput" placeholder="やることを入力（例：漢字ドリル）" />
      </div>
      <div class="row">
        <select id="eventSubject"></select>
        <button class="btn" id="addEvent">追加</button>
      </div>
    </div>
  </section>

  <!-- ===== Timer ===== -->
  <section class="view" id="view-timer">
    <div class="card timer-wrap" id="timerCard">
      <div class="clockart" id="clockart">
        <div class="halo"></div>
        <div class="ring"></div>
        <span class="spark s1">✦</span><span class="spark s2">✧</span>
        <span class="spark s3">✧</span><span class="spark s4">✦</span>
        <div class="clockface">
          <svg viewBox="0 0 100 100" fill="none">
            <circle cx="50" cy="50" r="42" fill="#f7dade"/>
            <circle cx="50" cy="50" r="42" stroke="#e7a6ab" stroke-width="3"/>
            <line x1="50" y1="50" x2="50" y2="26" stroke="#5b5048" stroke-width="4" stroke-linecap="round" id="handMin"/>
            <line x1="50" y1="50" x2="68" y2="50" stroke="#5b5048" stroke-width="4" stroke-linecap="round" id="handHour"/>
            <circle cx="50" cy="50" r="4" fill="#5b5048"/>
            <path d="M30 12 Q26 4 34 6" stroke="#e7a6ab" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path d="M70 12 Q74 4 66 6" stroke="#e7a6ab" stroke-width="3" fill="none" stroke-linecap="round"/>
          </svg>
        </div>
      </div>
      <div class="time-display" id="timeDisplay">00:00</div>
      <div class="subj-label" id="subjLabel">科目をえらんでね</div>

      <div class="row" style="justify-content:center;">
        <select id="timerSubject" style="max-width:260px;"></select>
      </div>
      <div class="timer-btns" style="margin-top:14px;">
        <button class="btn" id="startBtn">スタート</button>
        <button class="btn ghost" id="pauseBtn" style="display:none;">一時停止</button>
        <button class="btn sage" id="resetBtn" style="display:none;">きろくする</button>
      </div>
      <p class="muted" style="margin-top:14px;">とじても・リロードしても時間はすすみ続けます</p>
    </div>
  </section>

  <!-- ===== Report ===== -->
  <section class="view" id="view-report">
    <div class="card" style="text-align:center;">
      <div class="muted">きょうの勉強時間</div>
      <div class="big-num" id="todayTotal">0分</div>
    </div>
    <div class="card">
      <h2>科目べつ（きょう）</h2>
      <div id="subjectStats"></div>
    </div>
    <div class="card">
      <h2>この1週間</h2>
      <div class="week" id="weekChart"></div>
    </div>
    <div class="card">
      <h2>ぜんぶの合計</h2>
      <div class="big-num" id="grandTotal" style="font-size:28px;">0分</div>
    </div>
  </section>
</div>

<nav class="tabbar">
  <button data-tab="cal" class="active"><span class="ic">✿</span>カレンダー</button>
  <button data-tab="timer"><span class="ic">⏱</span>タイマー</button>
  <button data-tab="report"><span class="ic">☕</span>きろく</button>
</nav>

<script>
(function () {
  "use strict";
  var LS_KEY = "study-time-data-v1";
  var PALETTE = ["#e7a6ab","#a9bfa4","#b3aede","#e6c67a","#8fb8c9","#d6a4c4"];

  // ---------- Storage ----------
  function load() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return null;
  }
  function save() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
  }

  var state = load() || {
    subjects: [
      { id: "s1", name: "国語", color: "#e7a6ab" },
      { id: "s2", name: "算数", color: "#a9bfa4" },
      { id: "s3", name: "英語", color: "#b3aede" }
    ],
    events: {},          // { "2026-08-11": [{id,text,subjectId}] }
    sessions: [],        // { id, subjectId, seconds, date, ts }
    timer: null          // { subjectId, startedAt, accumulated, running }
  };

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function todayKey(d) {
    d = d || new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function subjById(id) {
    for (var i = 0; i < state.subjects.length; i++) if (state.subjects[i].id === id) return state.subjects[i];
    return null;
  }
  function fmtDur(sec) {
    var m = Math.floor(sec / 60), h = Math.floor(m / 60);
    if (h > 0) return h + "時間" + (m % 60) + "分";
    if (m > 0) return m + "分";
    return sec + "秒";
  }

  // ---------- Tabs ----------
  var tabButtons = document.querySelectorAll("nav.tabbar button");
  var views = { cal: document.getElementById("view-cal"), timer: document.getElementById("view-timer"), report: document.getElementById("view-report") };
  tabButtons.forEach(function (b) {
    b.addEventListener("click", function () {
      tabButtons.forEach(function (x) { x.classList.remove("active"); });
      b.classList.add("active");
      Object.keys(views).forEach(function (k) { views[k].classList.remove("active"); });
      views[b.dataset.tab].classList.add("active");
      if (b.dataset.tab === "report") renderReport();
      if (b.dataset.tab === "timer") renderTimer();
    });
  });

  // ---------- Calendar ----------
  var viewDate = new Date();
  var selectedKey = todayKey();

  function renderDow() {
    var names = ["日","月","火","水","木","金","土"];
    var html = "";
    for (var i = 0; i < 7; i++) {
      var cls = i === 0 ? "dow sun" : i === 6 ? "dow sat" : "dow";
      html += '<div class="' + cls + '">' + names[i] + "</div>";
    }
    document.getElementById("dowRow").innerHTML = html;
  }

  function renderCalendar() {
    var y = viewDate.getFullYear(), m = viewDate.getMonth();
    document.getElementById("monthTitle").textContent = y + "年 " + (m + 1) + "月";
    var first = new Date(y, m, 1).getDay();
    var days = new Date(y, m + 1, 0).getDate();
    var grid = document.getElementById("calGrid");
    grid.innerHTML = "";
    for (var i = 0; i < first; i++) {
      var e = document.createElement("div"); e.className = "day empty"; grid.appendChild(e);
    }
    for (var d = 1; d <= days; d++) {
      var key = y + "-" + String(m + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0");
      var cell = document.createElement("div");
      cell.className = "day";
      if (key === todayKey()) cell.classList.add("today");
      if (key === selectedKey) cell.classList.add("selected");
      cell.innerHTML = "<div>" + d + "</div>";
      var evs = state.events[key] || [];
      if (evs.length) {
        var pips = document.createElement("div"); pips.className = "pips";
        for (var p = 0; p < Math.min(evs.length, 4); p++) {
          var sub = subjById(evs[p].subjectId);
          var pip = document.createElement("span"); pip.className = "pip";
          pip.style.background = sub ? sub.color : "#c9beb4";
          pips.appendChild(pip);
        }
        cell.appendChild(pips);
      }
      (function (k) { cell.addEventListener("click", function () { selectedKey = k; renderCalendar(); renderEvents(); }); })(key);
      grid.appendChild(cell);
    }
  }

  function renderEvents() {
    var parts = selectedKey.split("-");
    document.getElementById("selDateTitle").textContent = Number(parts[1]) + "月" + Number(parts[2]) + "日 の予定";
    var list = document.getElementById("eventList");
    var evs = state.events[selectedKey] || [];
    if (!evs.length) { list.innerHTML = '<div class="empty-note">まだ予定はありません</div>'; return; }
    list.innerHTML = "";
    evs.forEach(function (ev) {
      var sub = subjById(ev.subjectId);
      var row = document.createElement("div"); row.className = "event-row";
      row.innerHTML =
        '<span class="swatch" style="background:' + (sub ? sub.color : "#c9beb4") + '"></span>' +
        '<span class="etext">' + escapeHtml(ev.text) + (sub ? ' <span class="muted">/ ' + escapeHtml(sub.name) + "</span>" : "") + "</span>" +
        '<button class="del" aria-label="削除">×</button>';
      row.querySelector(".del").addEventListener("click", function () {
        state.events[selectedKey] = state.events[selectedKey].filter(function (x) { return x.id !== ev.id; });
        if (!state.events[selectedKey].length) delete state.events[selectedKey];
        save(); renderEvents(); renderCalendar();
      });
      list.appendChild(row);
    });
  }

  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

  document.getElementById("prevMonth").addEventListener("click", function () { viewDate.setMonth(viewDate.getMonth() - 1); renderCalendar(); });
  document.getElementById("nextMonth").addEventListener("click", function () { viewDate.setMonth(viewDate.getMonth() + 1); renderCalendar(); });

  document.getElementById("addEvent").addEventListener("click", addEvent);
  document.getElementById("eventInput").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.isComposing && e.keyCode !== 229) addEvent();
  });
  function addEvent() {
    var input = document.getElementById("eventInput");
    var txt = input.value.trim();
    if (!txt) return;
    var sid = document.getElementById("eventSubject").value;
    if (!state.events[selectedKey]) state.events[selectedKey] = [];
    state.events[selectedKey].push({ id: uid(), text: txt, subjectId: sid });
    input.value = "";
    save(); renderEvents(); renderCalendar();
  }

  // ---------- Subject selects ----------
  function fillSubjectSelects() {
    var opts = state.subjects.map(function (s) { return '<option value="' + s.id + '">' + escapeHtml(s.name) + "</option>"; }).join("");
    document.getElementById("eventSubject").innerHTML = opts;
    var t = document.getElementById("timerSubject");
    var cur = t.value;
    t.innerHTML = opts;
    if (cur) t.value = cur;
  }

  // ---------- Timer ----------
  var tickHandle = null;

  function elapsedSeconds() {
    if (!state.timer) return 0;
    var acc = state.timer.accumulated || 0;
    if (state.timer.running && state.timer.startedAt) {
      acc += Math.floor((Date.now() - state.timer.startedAt) / 1000);
    }
    return acc;
  }

  function fmtClock(sec) {
    var m = Math.floor(sec / 60), s = sec % 60, h = Math.floor(m / 60);
    if (h > 0) return h + ":" + String(m % 60).padStart(2, "0") + ":" + String(s).padStart(2, "0");
    return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
  }

  function renderTimer() {
    var card = document.getElementById("timerCard");
    var startBtn = document.getElementById("startBtn");
    var pauseBtn = document.getElementById("pauseBtn");
    var resetBtn = document.getElementById("resetBtn");
    var subjLabel = document.getElementById("subjLabel");
    var sec = elapsedSeconds();
    document.getElementById("timeDisplay").textContent = fmtClock(sec);

    // clock hands move with time
    var min = document.getElementById("handMin"), hr = document.getElementById("handHour");
    if (min && hr) {
      var mAng = (sec / 60) * 6;   // per minute
      var hAng = (sec / 3600) * 30;
      min.setAttribute("transform", "rotate(" + mAng + " 50 50)");
      hr.setAttribute("transform", "rotate(" + hAng + " 50 50)");
    }

    if (state.timer) {
      var sub = subjById(state.timer.subjectId);
      subjLabel.textContent = sub ? sub.name + " を勉強中" : "勉強中";
      if (state.timer.running) {
        card.classList.add("running");
        startBtn.style.display = "none";
        pauseBtn.style.display = "";
      } else {
        card.classList.remove("running");
        startBtn.style.display = "";
        startBtn.textContent = "つづける";
        pauseBtn.style.display = "none";
      }
      resetBtn.style.display = "";
    } else {
      card.classList.remove("running");
      startBtn.style.display = ""; startBtn.textContent = "スタート";
      pauseBtn.style.display = "none";
      resetBtn.style.display = "none";
      subjLabel.textContent = "科目をえらんでね";
    }
  }

  function startTick() {
    if (tickHandle) return;
    tickHandle = setInterval(function () {
      if (views.timer.classList.contains("active")) renderTimer();
    }, 1000);
  }
  function stopTick() { if (tickHandle) { clearInterval(tickHandle); tickHandle = null; } }

  document.getElementById("startBtn").addEventListener("click", function () {
    var sid = document.getElementById("timerSubject").value;
    if (!state.timer) {
      state.timer = { subjectId: sid, startedAt: Date.now(), accumulated: 0, running: true };
    } else {
      state.timer.startedAt = Date.now();
      state.timer.running = true;
    }
    save(); renderTimer(); startTick();
  });

  document.getElementById("pauseBtn").addEventListener("click", function () {
    if (!state.timer) return;
    state.timer.accumulated = elapsedSeconds();
    state.timer.running = false;
    state.timer.startedAt = null;
    save(); renderTimer();
  });

  document.getElementById("resetBtn").addEventListener("click", function () {
    if (!state.timer) return;
    var sec = elapsedSeconds();
    if (sec > 0) {
      state.sessions.push({ id: uid(), subjectId: state.timer.subjectId, seconds: sec, date: todayKey(), ts: Date.now() });
    }
    state.timer = null;
    save(); renderTimer(); stopTick();
    // gentle feedback
    var td = document.getElementById("timeDisplay");
    td.textContent = "00:00";
  });

  document.getElementById("timerSubject").addEventListener("change", function () {
    if (state.timer && !state.timer.running) { state.timer.subjectId = this.value; save(); renderTimer(); }
  });

  // ---------- Report ----------
  function renderReport() {
    var tk = todayKey();
    var todaySessions = state.sessions.filter(function (s) { return s.date === tk; });
    var todaySec = todaySessions.reduce(function (a, s) { return a + s.seconds; }, 0);
    document.getElementById("todayTotal").textContent = fmtDur(todaySec);

    // per subject today
    var bySub = {};
    todaySessions.forEach(function (s) { bySub[s.subjectId] = (bySub[s.subjectId] || 0) + s.seconds; });
    var wrap = document.getElementById("subjectStats");
    var keys = Object.keys(bySub);
    if (!keys.length) { wrap.innerHTML = '<div class="empty-note">きょうはまだ記録がありません</div>'; }
    else {
      var max = Math.max.apply(null, keys.map(function (k) { return bySub[k]; }));
      wrap.innerHTML = "";
      keys.sort(function (a, b) { return bySub[b] - bySub[a]; }).forEach(function (k) {
        var sub = subjById(k);
        var row = document.createElement("div"); row.className = "stat-row";
        row.innerHTML =
          '<span class="lab">' + (sub ? escapeHtml(sub.name) : "その他") + "</span>" +
          '<span class="bar-track"><span class="bar-fill" style="width:' + (bySub[k] / max * 100) + "%;background:" + (sub ? sub.color : "#c9beb4") + '"></span></span>' +
          '<span class="val">' + fmtDur(bySub[k]) + "</span>";
        wrap.appendChild(row);
      });
    }

    // week chart
    var week = document.getElementById("weekChart");
    week.innerHTML = "";
    var dowNames = ["日","月","火","水","木","金","土"];
    var totals = [];
    for (var i = 6; i >= 0; i--) {
      var d = new Date(); d.setDate(d.getDate() - i);
      var key = todayKey(d);
      var t = state.sessions.filter(function (s) { return s.date === key; }).reduce(function (a, s) { return a + s.seconds; }, 0);
      totals.push({ key: key, sec: t, dow: dowNames[d.getDay()], isToday: key === tk });
    }
    var wmax = Math.max.apply(null, totals.map(function (t) { return t.sec; }).concat([1]));
    totals.forEach(function (t) {
      var col = document.createElement("div"); col.className = "col" + (t.isToday ? " today" : "");
      var h = t.sec > 0 ? Math.max(4, (t.sec / wmax) * 100) : 2;
      col.innerHTML = '<div class="colbar" style="height:' + h + '%"></div><div class="collabel">' + t.dow + "</div>";
      week.appendChild(col);
    });

    var grand = state.sessions.reduce(function (a, s) { return a + s.seconds; }, 0);
    document.getElementById("grandTotal").textContent = fmtDur(grand);
  }

  // ---------- Boot ----------
  // If timer was running when the page closed, it keeps counting via startedAt.
  renderDow();
  fillSubjectSelects();
  renderCalendar();
  renderEvents();
  renderTimer();
  if (state.timer && state.timer.running) startTick();

  // keep timer state fresh across background/foreground on iOS
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && views.timer.classList.contains("active")) renderTimer();
  });

  // save on hide (extra safety)
  window.addEventListener("pagehide", save);
})();
</script>
</body>
</html>
